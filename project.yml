name: AIUsageWidget
options:
  bundleIdPrefix: jp.shigeya
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig

targets:
  AIUsageWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: AIUsageWidgetExtension
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - AIUsageWidgetTests
    info:
      path: App/Info.plist
      properties:
        # ウィジェットギャラリーのアプリ一覧は .app のファイル名を見る。
        # 濁点を含まないので NFC/NFD の食い違いが起きない。
        CFBundleName: Cursor使用量
        CFBundleDisplayName: Cursor使用量
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon76x76
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: App/AIUsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.security.temporary-exception.files.home-relative.read-only:
          - Library/Application Support/Cursor/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.AIUsageWidget
        PRODUCT_NAME: AIUsageWidget
        WRAPPER_NAME: Cursor使用量.app
        # 実行ファイル名は ASCII のまま。一覧用の .app 名だけ日本語にする。
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        APP_GROUP_ID: $(DEVELOPMENT_TEAM).jp.shigeya.AIUsageWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: NO
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"

  AIUsageWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
      - path: Shared
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleName: Cursor使用量
        CFBundleDisplayName: Cursor使用量
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon76x76
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: WidgetExtension/AIUsageWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.AIUsageWidget.Widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        APP_GROUP_ID: $(DEVELOPMENT_TEAM).jp.shigeya.AIUsageWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: NO
        SKIP_INSTALL: false
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"

  # ホストアプリを立てない単体テスト。常駐アプリが起動して初回取得が走らないように Shared を直接取り込む。
  AIUsageWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.AIUsageWidget.Tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
